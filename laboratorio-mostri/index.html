<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monster Laboratory</title>
<!--DEV-ONLY-->
<script>
// Aperto con doppio clic dalla cartella del progetto (file://): il sorgente non può girare senza Vite, quindi apro la versione compilata.
if(location.protocol==='file:')location.replace('dist/index.html');
</script>
<!--/DEV-ONLY-->
<script>
// Schermata di caricamento ed errore: la pagina non resta mai bianca. Se qualcosa si rompe all'avvio compare un messaggio con il pulsante per azzerare il salvataggio.
window.__fatal=function(e){
 var b=document.getElementById('boot');if(!b||window.__ready)return;
 var M={en:['The game could not start.','Reset save and retry'],it:['Il gioco non è partito.','Azzera il salvataggio e riprova'],es:['El juego no ha podido arrancar.','Borrar la partida y reintentar'],fr:['Le jeu n\'a pas pu démarrer.','Effacer la partie et réessayer'],zh:['游戏无法启动。','重置存档并重试'],ru:['Не удалось запустить игру.','Сбросить сохранение и повторить']};
 var t=M[String(navigator.language||'').slice(0,2).toLowerCase()]||M.en;
 b.innerHTML='<div style="padding:24px;max-width:420px;text-align:center"><div style="font-size:48px">🧪</div><p style="font-size:16px">'+t[0]+'</p><p style="font-size:12px;opacity:.7;word-break:break-word">'+String(e&&e.message||e||'').slice(0,160)+'</p><button id="bootRs" style="font:inherit;padding:12px 18px;border:0;border-radius:12px;background:#6cc22a;color:#fff">'+t[1]+'</button></div>';
 document.getElementById('bootRs').onclick=function(){try{localStorage.removeItem('ml_save_v1')}catch(x){}location.reload()}};
addEventListener('error',function(ev){var t=ev.target;if(t&&t.tagName==='SCRIPT'&&t.src&&t.src.indexOf('playgama')<0)window.__fatal('script: '+t.src.split('/').pop());else if((!t||t===window)&&String(ev.filename||'').indexOf('playgama')<0)window.__fatal(ev.error||ev.message)},true);
</script>
<!-- Playgama Bridge dal CDN, come indicato nella documentazione (script normale, prima del gioco). Se non si carica (offline) il gioco parte comunque. -->
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js" onerror="window.__bridgeFail=1"></script>
</head>
<body>
<!-- Schermata di caricamento del gioco: nome, mostro e barra mentre si caricano tutte le immagini (src/preload.js). Stili qui, così si vede subito. -->
<style>
#boot{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#f2e9ff;font:700 15px ui-rounded,"Nunito","Segoe UI Rounded",system-ui,sans-serif;
 background:radial-gradient(ellipse 70% 50% at 50% 45%,#6a34c8 0,#3b1c70 40%,transparent 75%),linear-gradient(#1a0f33,#0a0614);transition:opacity .5s}
#boot.out{opacity:0;pointer-events:none}
#boot::before{content:'';position:absolute;left:50%;top:42%;width:220vmax;height:220vmax;translate:-50% -50%;background:repeating-conic-gradient(#ffffff0d 0 7deg,transparent 7deg 16deg);-webkit-mask:radial-gradient(circle,#000 6%,transparent 40%);mask:radial-gradient(circle,#000 6%,transparent 40%);animation:btr 40s linear infinite}
@keyframes btr{to{rotate:360deg}}
.bt-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(86vw,420px);text-align:center}
.bt-m{width:min(44vw,40vh,220px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 10px 18px #000b);animation:btb 2.2s ease-in-out infinite}
@keyframes btb{50%{transform:translateY(-10px) scale(1.03)}}
#bootT{margin:0;font-size:clamp(30px,9vw,52px);line-height:1;font-weight:900;letter-spacing:.5px;color:#ffd36b;text-shadow:0 3px 0 #7a3a00,0 0 22px #ffb02e88}
#bootT small{display:block;margin-top:6px;font-size:.55em;letter-spacing:2px;color:#c79bff;text-shadow:0 2px 0 #2a0f55}
.bt-bar{width:100%;height:18px;border-radius:12px;background:#0008;border:2px solid #ffffff2a;overflow:hidden;box-shadow:inset 0 2px 6px #000a}
#bootBar{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(#a6f06a,#4fa81c);box-shadow:inset 0 3px 0 #ffffff55;transition:width .25s}
#bootPct{font-size:14px;color:#e6d8ff;opacity:.85}
@media (prefers-reduced-motion:reduce){#boot::before,.bt-m{animation:none}}
</style>
<div id="boot"><div class="bt-in"><img class="bt-m" src="m/lumizucca.webp" alt=""><h1 id="bootT">MONSTER<small>LABORATORY</small></h1><div class="bt-bar"><i id="bootBar"></i></div><div id="bootPct">0%</div></div></div>
<script>(function(){var T={en:['MONSTER','LABORATORY','Loading monsters…'],it:['LABORATORIO','DI MOSTRI','Caricamento dei mostri…'],es:['LABORATORIO','DE MONSTRUOS','Cargando monstruos…'],fr:['LABORATOIRE','DE MONSTRES','Chargement des monstres…'],zh:['怪物','实验室','正在加载怪物……'],ru:['ЛАБОРАТОРИЯ','МОНСТРОВ','Загрузка монстров…']},t=T[String(navigator.language||'').slice(0,2).toLowerCase()]||T.en;document.getElementById('bootT').innerHTML=t[0]+'<small>'+t[1]+'</small>';document.getElementById('bootPct').setAttribute('data-l',t[2])})()</script>

  <div id="skh"></div>

  <div class="ulk" id="uLk"></div>

 </div>
