<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(fonts/lilita.woff2) format('woff2')}
@font-face{font-family:Fredoka;src:url(fonts/fredoka.woff2) format('woff2');font-weight:300 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07040f}
/* u = unità di base: 1% del lato corto. Ogni formato sposta i blocchi con le variabili sotto */
#c{position:relative;width:100vw;height:100vh;overflow:hidden;--u:1vmin;font-family:Fredoka,sans-serif;color:#fff}
.abs{position:absolute}
/* ---------- cielo e parete ---------- */
.sky{inset:0;background:
 radial-gradient(ellipse 60% 45% at 50% 58%,#8b43ff99 0,transparent 70%),
 radial-gradient(ellipse 40% 30% at 15% 85%,#14b87a55 0,transparent 70%),
 radial-gradient(ellipse 40% 30% at 85% 85%,#ff5a1a44 0,transparent 70%),
 radial-gradient(ellipse 90% 60% at 50% 0%,#3a1f8a 0,transparent 70%),
 linear-gradient(#1b0d3d,#0d0620 55%,#070310)}
/* finestra rotonda con luna, stelle e fulmine */
.win{left:50%;top:var(--wy);width:var(--ww);aspect-ratio:1;translate:-50% 0;border-radius:50%;overflow:hidden;
 background:radial-gradient(circle at 70% 30%,#fff8d8 0 6%,#ffe9a0 7%,#ffd36b44 13%,transparent 30%),radial-gradient(circle at 50% 120%,#6a2cd8 0,#2a1170 45%,#0d0730 80%);
 box-shadow:0 0 0 calc(var(--u)*1.4) #2a1a4a,0 0 0 calc(var(--u)*2.2) #120a24,0 0 calc(var(--u)*10) #8b43ff66,inset 0 0 calc(var(--u)*6) #000a}
.win svg{position:absolute;inset:0;width:100%;height:100%}
.win::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 48.6%,#120a24 48.6% 51.4%,transparent 51.4%),linear-gradient(transparent 48.6%,#120a24 48.6% 51.4%,transparent 51.4%)}
/* raggi di luce volumetrici */
.rays{left:50%;top:var(--wy);width:calc(var(--ww)*3.2);height:150%;translate:-50% 0;background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,#b98bff22 8deg,transparent 14deg,#ffe9a018 20deg,transparent 26deg,#b98bff1c 32deg,transparent 40deg);filter:blur(calc(var(--u)*1.2));mix-blend-mode:screen}
/* scaffali con ampolle */
.shelf{top:var(--sy);width:var(--sw)}
.shelf.L{left:var(--sx)}.shelf.R{right:var(--sx);transform:scaleX(-1)}
/* nebbia */
.fog{border-radius:50%;filter:blur(calc(var(--u)*5));mix-blend-mode:screen}
/* pavimento in prospettiva */
.floor{left:-20%;right:-20%;bottom:0;height:var(--fh);background:
 linear-gradient(#0000,#000a),
 repeating-linear-gradient(90deg,#8b5cff22 0 2px,transparent 2px calc(var(--u)*9)),
 repeating-linear-gradient(#8b5cff22 0 2px,transparent 2px calc(var(--u)*6)),
 linear-gradient(#2a1460,#120830);transform:perspective(calc(var(--u)*60)) rotateX(58deg);transform-origin:50% 100%;
 -webkit-mask:linear-gradient(transparent,#000 30%)}
/* cerchio magico sotto l'eroe */
.circle{left:50%;bottom:var(--cb);width:var(--cw);translate:-50% 0;transform:perspective(calc(var(--u)*60)) rotateX(68deg);filter:drop-shadow(0 0 calc(var(--u)*1.5) #ffb02e) drop-shadow(0 0 calc(var(--u)*4) #ff7a1a)}
/* vasche */
.tank{width:var(--tw);aspect-ratio:.52;border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*2) calc(var(--u)*2);
 background:linear-gradient(100deg,transparent 10%,#ffffff40 14%,#ffffff10 22%,transparent 26%,transparent 78%,#ffffff22 82%,transparent 86%),
 linear-gradient(hsl(var(--h) 80% 55% / .15),hsl(var(--h) 85% 50% / .55) 45%,hsl(var(--h) 90% 40% / .85));
 border:calc(var(--u)*.4) solid hsl(var(--h) 80% 70% / .7);box-shadow:0 0 calc(var(--u)*4) hsl(var(--h) 90% 55% / .55),inset 0 0 calc(var(--u)*3) hsl(var(--h) 90% 70% / .5);overflow:visible}
.tank::before,.tank::after{content:'';position:absolute;left:-12%;right:-12%;height:11%;border-radius:calc(var(--u)*1.2);background:linear-gradient(#9aa0c0,#4a4f70 50%,#22253a);box-shadow:0 calc(var(--u)*.4) calc(var(--u)*.8) #000a,inset 0 calc(var(--u)*.3) 0 #fff5}
.tank::before{top:-8%}.tank::after{bottom:-8%}
.tank img{position:absolute;left:8%;width:84%;top:22%;filter:drop-shadow(0 0 calc(var(--u)*1.5) hsl(var(--h) 90% 70%))}
.tank i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,hsl(var(--h) 90% 80% / .5) 40%,transparent 70%);border:1px solid #fff6}
.tank b{position:absolute;right:-6%;top:6%;font:calc(var(--u)*2.2)/1 Lilita;padding:calc(var(--u)*.5) calc(var(--u)*1);border-radius:calc(var(--u)*1.2);background:linear-gradient(hsl(var(--h) 70% 50%),hsl(var(--h) 70% 25%));border:2px solid #fff8;box-shadow:0 calc(var(--u)*.4) 0 #0008}
.pipe{height:calc(var(--u)*1.2);border-radius:9px;background:linear-gradient(#aab0d0,#4a4f70 60%,#22253a);box-shadow:0 0 calc(var(--u)*1) #000a}
/* campioni */
.ch{filter:drop-shadow(0 calc(var(--u)*1) calc(var(--u)*1.5) #000d)}
.glow{border-radius:50%;filter:blur(calc(var(--u)*4));mix-blend-mode:screen}
.hero{z-index:5;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 1px #000) drop-shadow(0 calc(var(--u)*1) calc(var(--u)*2) #000c)}
.back{filter:drop-shadow(0 0 calc(var(--u)*2) #000) brightness(.78) saturate(1.1) blur(calc(var(--u)*.12))}
/* esplosione di energia dietro l'eroe */
.burst{left:50%;translate:-50% -50%;width:var(--bw);aspect-ratio:1;background:repeating-conic-gradient(from 0deg,#ffd36b55 0 3deg,transparent 3deg 11deg,#ff9d2e33 11deg 13deg,transparent 13deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,#000 18%,transparent 62%);mix-blend-mode:screen;filter:blur(1px)}
.core{left:50%;translate:-50% -50%;width:calc(var(--bw)*.42);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe9a0 18%,#ff9d2e88 40%,#ff5a1a22 62%,transparent 72%);mix-blend-mode:screen}
/* monete, gemme, sfere */
.coin{width:var(--s);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9d0 0 8%,#ffe066 22%,#f5b80f 55%,#b8740a 80%,#7a4a00);box-shadow:inset 0 0 0 calc(var(--s)*.07) #ffd34a,inset 0 0 0 calc(var(--s)*.11) #c98a0a,0 calc(var(--s)*.06) calc(var(--s)*.15) #000a,0 0 calc(var(--s)*.5) #ffc23a88;rotate:var(--r,0deg);transform:scaleX(var(--sx,1))}
.coin::after{content:'★';position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s)*.5);color:#c98a0a;text-shadow:0 1px 0 #fff7}
.gem{width:var(--s);filter:drop-shadow(0 0 calc(var(--s)*.25) var(--gc))}
.orb{width:var(--s);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e2b8ff 20%,#a35cff 55%,#4a1890);box-shadow:0 0 calc(var(--s)*.6) #b77bff,inset 0 0 calc(var(--s)*.2) #fff8}
.spark{width:var(--s);aspect-ratio:1;background:radial-gradient(circle,#fff 0 8%,transparent 12%),conic-gradient(from 45deg,transparent 0 40deg,#fff 45deg,transparent 50deg 130deg,#fff 135deg,transparent 140deg 220deg,#fff 225deg,transparent 230deg 310deg,#fff 315deg,transparent 320deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 70%);filter:drop-shadow(0 0 4px #ffd36b)}
.ember{width:var(--s);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff,#ffb02e 40%,transparent 70%)}
.trail{height:calc(var(--u)*.5);border-radius:9px;background:linear-gradient(90deg,transparent,#ffe9a0aa);transform-origin:100% 50%}
/* scritte di gioco */
.badge{font:calc(var(--u)*2.6)/1 Lilita;letter-spacing:.04em;padding:calc(var(--u)*1) calc(var(--u)*2.2);border-radius:calc(var(--u)*3);background:linear-gradient(#ffe07a,#ff9d2e);color:#5a2400;border:calc(var(--u)*.35) solid #fff6;box-shadow:0 calc(var(--u)*.6) 0 #7a3a00,0 0 calc(var(--u)*3) #ffb02eaa;white-space:nowrap}
.crit{z-index:9;font:calc(var(--u)*5.2)/1 Lilita;color:#ffe34a;-webkit-text-stroke:calc(var(--u)*.35) #7a1a00;paint-order:stroke;text-shadow:0 calc(var(--u)*.5) 0 #7a1a00,0 0 calc(var(--u)*3) #ff5a1a;rotate:-10deg;white-space:nowrap}
.crit small{display:block;font-size:.55em;color:#fff;-webkit-text-stroke:calc(var(--u)*.25) #5a1a00}
.lvl{font:calc(var(--u)*2.4)/1 Lilita;padding:calc(var(--u)*.7) calc(var(--u)*1.4);border-radius:calc(var(--u)*2);background:#0009;border:2px solid #ffffff55;white-space:nowrap}
/* carte dell'unione */
.merge{display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.6);border-radius:calc(var(--u)*3);background:linear-gradient(#2a1a55e8,#160c33e8);border:calc(var(--u)*.3) solid #b77bff88;box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) #000a,0 0 calc(var(--u)*4) #8b43ff55}
.card{position:relative;width:var(--k);aspect-ratio:1;border-radius:calc(var(--k)*.18);display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,hsl(var(--h) 60% 40%),hsl(var(--h) 60% 12%));border:calc(var(--u)*.35) solid hsl(var(--h) 80% 65%);box-shadow:0 0 calc(var(--u)*2) hsl(var(--h) 90% 55% / .7)}
.card img{width:86%}
.card b{position:absolute;right:-8%;bottom:-8%;font:calc(var(--k)*.22)/1 Lilita;padding:calc(var(--k)*.05) calc(var(--k)*.1);border-radius:calc(var(--k)*.1);background:linear-gradient(hsl(var(--h) 70% 50%),hsl(var(--h) 70% 25%));border:2px solid #fff8}
.op{font:calc(var(--u)*4.4)/1 Lilita;color:#fff;text-shadow:0 0 calc(var(--u)*1.5) #b77bff}
.arrow{font:calc(var(--u)*4.4)/1 Lilita;color:#8be04a;text-shadow:0 0 calc(var(--u)*1.5) #8be04a}
.card.big{--k:calc(var(--kk)*1.35);box-shadow:0 0 calc(var(--u)*4) #ffd36b,0 0 0 calc(var(--u)*.4) #ffd36b}
/* logo */
.logo{left:50%;translate:-50% 0;top:var(--ly);text-align:center;white-space:nowrap;z-index:8}
.logo h1{font:var(--ls)/.86 Lilita;letter-spacing:.02em;position:relative}
.l1{display:block;color:#ffd84a;background:linear-gradient(#fffbe0 5%,#ffe066 30%,#ffb31a 62%,#ff7a00 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 calc(var(--ls)*.012) 0 #c25a00) drop-shadow(0 calc(var(--ls)*.012) 0 #a24600) drop-shadow(0 calc(var(--ls)*.012) 0 #7a3200) drop-shadow(0 calc(var(--ls)*.012) 0 #5a2200) drop-shadow(0 calc(var(--ls)*.04) calc(var(--ls)*.04) #000c) drop-shadow(0 0 calc(var(--ls)*.12) #ffb02e88)}
.l2{display:block;font-size:.6em;margin-top:.06em;background:linear-gradient(#f6ecff 5%,#d3a8ff 40%,#9b55ff 75%,#6a22d8);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 calc(var(--ls)*.01) 0 #4a1a9a) drop-shadow(0 calc(var(--ls)*.01) 0 #3a1080) drop-shadow(0 calc(var(--ls)*.01) 0 #2a0a60) drop-shadow(0 calc(var(--ls)*.04) calc(var(--ls)*.04) #000c) drop-shadow(0 0 calc(var(--ls)*.12) #b77bff88)}
.outline{position:absolute;inset:0;color:transparent;-webkit-text-stroke:calc(var(--ls)*.02) #fff;opacity:.35;pointer-events:none}
.tag{display:inline-block;margin-top:calc(var(--ls)*.12);font:700 calc(var(--ls)*.2)/1 Fredoka;letter-spacing:.08em;padding:.45em 1.2em;border-radius:3em;background:linear-gradient(#7be04a,#2f8a14);border:calc(var(--u)*.3) solid #d6ffb0aa;box-shadow:0 calc(var(--u)*.6) 0 #1a4a08,0 0 calc(var(--u)*3) #6cc22a99;text-shadow:0 2px 0 #1a4a08}
/* pulsante gioca */
.cta{z-index:9;font:calc(var(--u)*var(--cs))/1 Lilita;letter-spacing:.04em;padding:.55em 1.6em .6em;border-radius:1em;color:#fff;background:linear-gradient(#ffd36b 0,#ff9d2e 48%,#ff6a00 52%,#e04a00);border:calc(var(--u)*.45) solid #fff3c0;box-shadow:0 .14em 0 #8a2a00,0 .3em .5em #000a,0 0 1em #ff9d2e;text-shadow:0 .06em 0 #8a2a00;white-space:nowrap}
.cta::before{content:'';position:absolute;left:8%;right:8%;top:6%;height:40%;border-radius:1em;background:linear-gradient(#ffffffaa,#fff0)}
.hand{font-size:calc(var(--u)*var(--cs)*1.3);z-index:10;filter:drop-shadow(0 4px 4px #000a);rotate:-15deg}
.vig{inset:0;background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 55%,#000c);z-index:20;pointer-events:none}
.grain{inset:0;z-index:21;opacity:.07;mix-blend-mode:overlay;pointer-events:none}

/* ======================= formati ======================= */
/* 16:9 */
.h{--wy:-6vh;--ww:46vh;--sy:12vh;--sw:22vw;--sx:1vw;--fh:42vh;--cb:4vh;--cw:34vw;--bw:78vh;--tw:7.5vw;--ly:3vh;--ls:15vh;--cs:5;--kk:8vh}

.q{--wy:-8vh;--ww:44vh;--sy:30vh;--sw:30vw;--sx:-4vw;--fh:40vh;--cb:5vh;--cw:56vw;--bw:80vh;--tw:12vw;--ly:3vh;--ls:13.5vh;--cs:4.6;--kk:7vw}
/* 9:16 */
.v{--wy:3vh;--ww:62vw;--sy:30vh;--sw:44vw;--sx:-8vw;--fh:30vh;--cb:9vh;--cw:110vw;--bw:110vw;--tw:17vw;--ly:5vh;--ls:21vw;--cs:6.6;--kk:12vw}
</style></head>
